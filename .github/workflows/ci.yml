name: CI
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]

jobs:

  verify-code-style:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: 'false'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Lint
      run: dotnet format source/CecoChat.sln --verify-no-changes --verbosity detailed

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: 'false'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Generate certificate
      working-directory: source/certificates
      run: |
        openssl version
        bash create-certificate.sh

    - name: Restore
      run: |
        dotnet restore source/CecoChat.sln
        dotnet restore source/Check.sln

    - name: Build
      run: |
        dotnet build --no-restore source/CecoChat.sln
        dotnet build --no-restore source/Check.sln

    - name: Upload certificates needed for running the tests and code analysis
      uses: actions/upload-artifact@v7
      with:
        name: service-certificates
        path: source/certificates/services.*

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: 'false'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
      
    - name: Download certificate needed for testing
      uses: actions/download-artifact@v8
      with:
        name: service-certificates
        path: source/certificates

    - name: Restore
      run: |
        dotnet restore source/CecoChat.sln

    - name: Run tests
      # The service self-signed TLS certificate needs to be trusted so that the client can call the service successfully
      #
      # By default Coverlet creates a code coverage file for each test project in a project-specific dir
      # Merging all project-specific code coverage files is done using the approach described here: https://github.com/coverlet-coverage/coverlet/issues/357
      # '/maxcpucount:1' is mandatory
      # The comma ',' is escaped with '%2c' when converting the JSON output to OpenCover XML
      run: |
        sudo mv source/certificates/services.crt /usr/local/share/ca-certificates/services.crt
        sudo chmod 644 /usr/local/share/ca-certificates/services.crt
        sudo update-ca-certificates
        export CECOCHAT_START_TEST_CONTAINERS_CHATS_DB=true
        dotnet test source/CecoChat.sln --no-restore --logger "console;verbosity=detailed" /p:CollectCoverage=true /p:CoverletOutput="${GITHUB_WORKSPACE}/source/" /p:MergeWith="${GITHUB_WORKSPACE}/source/coverage.json" /p:CoverletOutputFormat="json%2copencover" /maxcpucount:1

    - name: Upload test logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-logs
        path: source/logs

    - name: Upload code coverage file
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage
        path: source/coverage.opencover.xml

  analyze-code-quality:
    needs: [verify-code-style, build, test]
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:

      - name: JDK 17 setup
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: 17

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: 'false'

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Download certificate needed for code analysis
        uses: actions/download-artifact@v8
        with:
          name: service-certificates
          path: source/certificates

      - name: Download code coverage file
        uses: actions/download-artifact@v8
        with:
          name: code-coverage
          path: source

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"cvetomir-todorov_CecoChat" /o:"cvetomirtodorov-cecochat" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="${GITHUB_WORKSPACE}/source/coverage.opencover.xml"
          dotnet build source/CecoChat.sln
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  containerize:
    needs: [analyze-code-quality]
    runs-on: ubuntu-latest
    # runs only when:
    # - there is a push or the workflow is dispatched
    # - branch is dev or a version tag is pushed (e.g. v0.1.0)
    # avoids being run on every commit to the PR
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    steps:

      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker setup
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: 'false'

      - name: Image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Config image
        uses: docker/build-push-action@v7
        with:
          file: package/cecochat/config.dockerfile
          context: ./source
          push: true
          tags: |
            cvetomirtodorov/cecochat-config:sha-${{ env.SHORT_SHA }}
            ${{ env.VERSION && format('cvetomirtodorov/cecochat-config:{0}', env.VERSION) || 'cvetomirtodorov/cecochat-config:dev' }}

      - name: BFF image
        uses: docker/build-push-action@v7
        with:
          file: package/cecochat/bff.dockerfile
          context: ./source
          push: true
          tags: |
            cvetomirtodorov/cecochat-bff:sha-${{ env.SHORT_SHA }}
            ${{ env.VERSION && format('cvetomirtodorov/cecochat-bff:{0}', env.VERSION) || 'cvetomirtodorov/cecochat-bff:dev' }}

      - name: Messaging image
        uses: docker/build-push-action@v7
        with:
          file: package/cecochat/messaging.dockerfile
          context: ./source
          push: true
          tags: |
            cvetomirtodorov/cecochat-messaging:sha-${{ env.SHORT_SHA }}
            ${{ env.VERSION && format('cvetomirtodorov/cecochat-messaging:{0}', env.VERSION) || 'cvetomirtodorov/cecochat-messaging:dev' }}

      - name: Chats image
        uses: docker/build-push-action@v7
        with:
          file: package/cecochat/chats.dockerfile
          context: ./source
          push: true
          tags: |
            cvetomirtodorov/cecochat-chats:sha-${{ env.SHORT_SHA }}
            ${{ env.VERSION && format('cvetomirtodorov/cecochat-chats:{0}', env.VERSION) || 'cvetomirtodorov/cecochat-chats:dev' }}

      - name: IDGen image
        uses: docker/build-push-action@v7
        with:
          file: package/cecochat/idgen.dockerfile
          context: ./source
          push: true
          tags: |
            cvetomirtodorov/cecochat-idgen:sha-${{ env.SHORT_SHA }}
            ${{ env.VERSION && format('cvetomirtodorov/cecochat-idgen:{0}', env.VERSION) || 'cvetomirtodorov/cecochat-idgen:dev' }}

      - name: User image
        uses: docker/build-push-action@v7
        with:
          file: package/cecochat/user.dockerfile
          context: ./source
          push: true
          tags: |
            cvetomirtodorov/cecochat-user:sha-${{ env.SHORT_SHA }}
            ${{ env.VERSION && format('cvetomirtodorov/cecochat-user:{0}', env.VERSION) || 'cvetomirtodorov/cecochat-user:dev' }}
